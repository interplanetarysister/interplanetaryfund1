# Legacy job retained as an on-demand, read-only LIVE frontend check.
# Automatically scheduled jobs and all legacy code builds are retired.
name: "Live IFund Frontend - Public assets"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check published IFund homepage
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 https://interplanetaryfund.com/ -o /tmp/ifund-home.html
          grep -Eiq '<html|<!doctype' /tmp/ifund-home.html
          echo "Published homepage returned an HTML document."
      - name: Check published Base44 frontend
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 https://interplanetaryfund.base44.app/ -o /tmp/ifund-base44.html
          grep -Eiq '<html|<!doctype' /tmp/ifund-base44.html
          echo "Base44 frontend returned an HTML document."
